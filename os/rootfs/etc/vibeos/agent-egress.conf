# agent-egress.conf — default network egress allowlist for VibeOS agents.
#
# One hostname per line (# starts a comment). vibeos-agent-egress@<instance>
# resolves these to IPs and adds them as IPAddressAllow= to the agent unit,
# on top of a base IPAddressDeny=any + IPAddressAllow=localhost. An agent thus
# reaches ONLY its model providers' hosts and loopback — nothing else.
#
# Add per-instance hosts (e.g. a private registry) in
# /etc/vibeos/agent.d/<instance>.egress. Keep this list minimal: every entry is
# a hole in the default-deny wall. Local-only setups (ollama) can leave it empty.

# Anthropic (Claude Code — subscription auth via `claude setup-token`).
api.anthropic.com

# OpenAI (Codex).
api.openai.com

# Google (Gemini CLI).
generativelanguage.googleapis.com
