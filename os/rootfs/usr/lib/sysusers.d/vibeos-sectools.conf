# vibeos-sectools.conf — sysusers for the security toolkit (layer 1d-bis).
#
# Some toolkit packages create a group by writing /etc/group directly in their
# RPM scriptlet; on an immutable/bootc system that trips the `sysusers` lint
# ("/etc/group entry without corresponding systemd sysusers.d"). Declaring the
# group here makes it reproducible via systemd-sysusers on first boot.
#
#   rtlsdr  device-access group pulled in by the SDR/wireless dependencies
#           (rtl-sdr / hackrf); grants non-root access to RTL-SDR dongles.
#
# Type  Name    ID  GECOS  Home
g rtlsdr -
