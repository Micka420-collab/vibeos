# vibeos.conf — systemd-sysusers fragment: VibeOS system users and groups
#
# Applied automatically by systemd-sysusers on first boot (image-based
# systems: no useradd/groupadd side effects at build time).
#
#   vibed          system account the AI daemon will run as from Phase 4
#                  (v0.1 runs vibed as root — see vibed.service; the account
#                  is created now so the uid stays stable across updates).
#   vibeos-agents  group gating access to the MCP socket: vibed chgrps
#                  /run/vibed/mcp.sock to root:vibeos-agents 0660 at startup.
#                  Add human/agent accounts to this group to let them talk
#                  to the daemon.
#
# Type  Name           ID  GECOS               Home
u vibed - "VibeOS AI daemon" -
g vibeos-agents -
