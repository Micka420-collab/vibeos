# VibeOS — activate the VibeOS SDDM greeter (branding)
# =============================================================================
# Target (image build): /usr/lib/sddm/sddm.conf.d/10-vibeos.conf
# Source: os/rootfs/usr/lib/sddm/sddm.conf.d/10-vibeos.conf (COPY-ed by the os
# track). This is the exact activation drop-in documented in
# desktop/sddm/README.md §Activation. The VibeOS greeter theme itself is copied
# to /usr/share/sddm/themes/vibeos by the os track (os/Containerfile).
#
# The vendor path /usr/lib/sddm/sddm.conf.d/ is correct for an immutable OS
# (nothing is written to /usr at runtime); a local admin can still override via
# /etc/sddm.conf.d/, which SDDM reads last. If loading the theme ever failed,
# SDDM falls back to its embedded greeter — login never becomes impossible.
[Theme]
Current=vibeos
