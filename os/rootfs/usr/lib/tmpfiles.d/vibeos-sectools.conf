# vibeos-sectools.conf — tmpfiles for the security toolkit (layer 1d-bis).
#
# On a bootc/OSTree system /var is machine-local mutable state: content baked
# into the image is not carried to a fresh deployment, and bootc lint flags
# any /var content missing a tmpfiles.d entry ("var-tmpfiles"). These toolkit
# packages ship a /var/lib state directory; recreate it at boot so a freshly
# installed machine has it with the right owner/mode.
#
#   aide      file-integrity database directory
#   clamav    antivirus signature store (updated by freshclam)
#   rkhunter  rootkit-hunter data directory
#
# Type Path             Mode UID         GID         Age Argument
d /var/lib/aide      0700 root       root       - -
d /var/lib/clamav    0755 clamupdate clamupdate - -
d /var/lib/rkhunter  0700 root       root       - -
