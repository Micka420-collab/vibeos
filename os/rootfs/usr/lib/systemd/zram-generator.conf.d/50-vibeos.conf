# 50-vibeos.conf — drop-in VibeOS pour le zram de Fedora (ADR-025).
#
# FUSIONNE avec /usr/lib/systemd/zram-generator.conf (livré par le paquet
# zram-generator-defaults de la base Kinoite — jamais écrasé par ce dépôt :
# précédent du COPY-clobber documenté dans os/Containerfile, garde kdeglobals).
# La fusion est PAR OPTION : les drop-ins priment sur le fichier principal
# (zram-generator.conf(5) upstream). Le dimensionnement Fedora est donc
# CONSERVÉ : zram-size = min(ram, 8192).
#
# Seul changement : compression zstd au lieu du défaut noyau lzo-rle
# (CONFIG_ZRAM_DEF_COMP_LZORLE=y sur le kernel F44). zstd compresse nettement
# mieux (≈ 3,7:1 contre ≈ 2,7:1 — benchmarks zram cités par l'Arch Wiki
# « Zram ») pour un coût CPU qui reste très au-dessous du débit demandé à un
# swap : sur la machine de référence (16 Go, bureau + agents + modèles
# locaux), la capacité effective prime sur la latence de compression. Couplé
# à vm.page-cluster=0 (50-vibeos-ai.conf) : pas de readahead, une page
# décompressée à la demande.
#
# Surcharge admin : un drop-in dans /etc/systemd/zram-generator.conf.d/ prime
# sur celui-ci ; un symlink vers /dev/null du même nom le neutralise.
# Mode amnésique (vibeos.amnesic=1) : sans objet — zram est volatil par
# nature, rien n'atteint un disque.
[zram0]
compression-algorithm = zstd
