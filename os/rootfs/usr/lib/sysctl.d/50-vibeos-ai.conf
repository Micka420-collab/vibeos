# 50-vibeos-ai.conf — réglages noyau VibeOS pour charges IA (ADR-025).
#
# Périmètre, délibérément étroit : le noyau reste le noyau Fedora GÉNÉRIQUE
# (la config kernel dédiée est un chantier Phase 7+, ROADMAP §9) et la cmdline
# n'est pas touchée (elle sera scellée dans l'UKI signée en Phase 4 — rien ici
# ne doit préempter cette chaîne). Ce fichier ne règle que des tunables à
# l'exécution, appliqués au boot par systemd-sysctl : réversible par retrait,
# surchargeable par l'admin (un fichier de même nom sous /etc/sysctl.d/ masque
# celui-ci ; un fichier trié après — ex. 99-local.conf — re-règle toute clé,
# cf. sysctl.d(5)).
#
# Chaque valeur est justifiée par une source primaire, citée en place — aucune
# n'a encore été mesurée sur la machine de référence : la validation sur cible
# est machine-gated (docs/BOOT-VALIDATION.md, check `kernel-tuning` du
# selfcheck). Détail des décisions et alternatives : docs/DECISIONS.md ADR-025.
#
# Ce qui n'est PAS ici, délibérément (cargo cult connu, vérifié sur F44) :
#   * vm.max_map_count — déjà 1048576 depuis F39 (systemd, 10-map-count.conf,
#     Change « IncreaseVmMaxMapCount ») ; suffisant pour les mmap d'ollama ;
#   * fs.file-max — déjà LONG_MAX depuis systemd 240 (NEWS : « automatically
#     bumped to the highest possible values ») ; la vraie limite est
#     RLIMIT_NOFILE, par service, pas ce sysctl ;
#   * net.core.default_qdisc — le fq_codel de systemd (50-default.conf)
#     convient à BBR : le pacing TCP interne (noyau >= 4.13) a levé
#     l'exigence de fq (Google, bbr-quick-start.md).

# --- Mémoire : le swap de VibeOS est zram, jamais un disque -------------------
# Le kickstart ne crée AUCUNE partition swap (installer/vibeos.ks : racine
# btrfs) ; le swap est le zram par défaut de Fedora (zram-generator-defaults,
# zram-size = min(ram, 8192) depuis F34). Les quatre réglages ci-dessous sont
# le jeu cohérent documenté pour ce cas : Pop!_OS default-settings PR #163
# (appliqué quand zram est actif), Arch Wiki « Zram », noyau
# admin-guide/sysctl/vm.rst.

# Readahead de swap à 2^0 page : lire par grappes de 8 pages (défaut 3)
# amortit des seeks de disque ; sur un périphérique MÉMOIRE, cela décompresse
# des pages que personne n'a demandées. ChromeOS le désactive depuis 2013
# (chromiumos-overlay, « sysctl.conf: disable swap read-ahead »).
vm.page-cluster = 0

# Swap en mémoire : vm.rst dit explicitement que > 100 se justifie quand le
# swap est plus rapide que le système de fichiers (son exemple : 133 pour un
# rapport de 2x). Pousser les pages anonymes froides vers zram LIBÈRE de la
# RAM pour le page cache — où vivent les poids de modèles mmap-és par
# ollama/llama.cpp (mmap PROT_READ + fadvise, llama-mmap.cpp) : un modèle
# rechargé à chaud ne retouche pas le disque. 180 est la valeur zram de
# Pop!_OS (PR #163). GARDE-FOU : ne vaut que parce qu'aucun swap disque
# n'existe ; si un swap disque apparaît un jour (hibernation…), redescendre
# cette valeur <= 100 dans le même commit.
vm.swappiness = 180

# Les deux watermarks accompagnent le duo ci-dessus (même source, PR #163) :
# pas de boost de réclamation sur fragmentation (mécanisme pensé pour du swap
# disque), et une marge kswapd un peu plus large pour lisser la réclamation
# sous pression (16 Go de référence : bureau + agents + modèles 7B-13B).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# --- Writeback : borner les rafales d'écriture (pulls de modèles multi-Go) ----
# En pourcentage de RAM (défauts : dirty_ratio 20 %, background 10 %), 16 Go
# laissent ~3,2 Go de pages sales s'accumuler avant écriture forcée — un pull
# ollama ou une ISO fige alors le bureau à chaque synchronisation (LWN « The
# pernicious USB-stick stall » : bornes ABSOLUES recommandées par Linus).
# Valeurs de Pop!_OS : writeback tôt (128 Mio) et régulier, latence bornée
# (256 Mio), sans coûter le débit séquentiel d'un NVMe. NB : dirty_bytes et
# dirty_ratio sont mutuellement exclusifs (régler l'un remet l'autre à 0) —
# c'est voulu et documenté (vm.rst).
vm.dirty_background_bytes = 134217728
vm.dirty_bytes = 268435456

# --- inotify : des agents qui REGARDENT des arbres de fichiers ----------------
# max_user_watches est auto-dimensionné depuis le noyau 5.11 (~1 % de la RAM,
# borné à 1048576 — commit 92890123749b) : on n'y touche pas. Le goulot réel
# est max_user_instances : 128 PAR UID, tous processus confondus — Claude Code
# + éditeur + watchers de build + HUD cumulés sur le même compte l'épuisent.
# 1024 est la valeur livrée par Pop!_OS.
fs.inotify.max_user_instances = 1024

# --- Réseau : BBR pour les gros transferts (modèles ollama, images OCI) -------
# Les téléchargements structurants de VibeOS sont des pulls multi-Go. BBR
# tient le débit sur les liens à fort produit bande passante × délai et à
# pertes, là où cubic s'effondre (Google, bbr-quick-start.md). Le noyau Fedora
# le construit en module (CONFIG_TCP_CONG_BBR=m, kernel-x86_64-fedora.config
# f44) et l'écriture de ce sysctl par systemd-sysctl (root, ordonné
# After=systemd-modules-load.service) AUTOCHARGE tcp_bbr (request_module dans
# net/ipv4/tcp_cong.c) — aucun modules-load.d n'est requis. Limites connues,
# assumées : BBRv1 peut être agressif envers cubic sur liens saturés à pertes
# (poste client, impact accepté) ; dans un netns NON-init (conteneur), pas
# d'autoload — le module est déjà chargé côté hôte au boot, les conteneurs
# podman héritent du choix de congestion de leur pile.
net.ipv4.tcp_congestion_control = bbr
