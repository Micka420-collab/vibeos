# Reverse-proxy Caddy + TLS local (mkcert) — modèle VibeOS par projet.
# Donne un `https://` de dev valide, 100% offline, devant votre app.
#
# Prérequis (une fois, avec le `mkcert` livré dans l'OS) :
#   mkcert -install                          # installe la CA locale dans le trust store
#   mkcert -cert-file certs/local.pem \
#          -key-file  certs/local-key.pem  monsaas.localhost "*.monsaas.localhost"
# Puis : podman compose up -d   →   https://monsaas.localhost
#
# Pourquoi Caddy (et pas nginx AUSSI) : un seul reverse-proxy, règle de
# non-redondance du projet. Caddy (Apache-2.0) se marie proprement avec mkcert.

services:
  proxy:
    image: docker.io/library/caddy:2
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./certs:/certs:ro,Z
    restart: unless-stopped
