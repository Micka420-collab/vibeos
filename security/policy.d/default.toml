# VibeOS default policy
# Installed as: /etc/vibeos/policy.d/default.toml (copied into the image by the
# Containerfile). Loaded by the vibed policy engine.
#
# ENGINE SEMANTICS (see README.md in this directory):
#   * Files in /etc/vibeos/policy.d/ are loaded in lexicographic filename
#     order; only *.toml files are considered.
#   * Rules are evaluated in order: the FIRST rule whose `tools` glob matches
#     the tool name wins, and evaluation stops there.
#   * No matching rule => DENY. Unknown tool => DENY (absolute default-deny).
#   * action = "allow" on a T0/T1 rule => allowed, subject to path/service
#     constraints. action = "allow" on a T2/T3 rule => ALWAYS requires human
#     approval (the tier is a floor); a T2/T3 allow rule whose `approval` is
#     not "human" is a LOAD ERROR.
#   * Any unreadable or invalid *.toml in policy.d makes vibed FAIL CLOSED:
#     it logs the error and exits non-zero (refuses to serve).
#
# BUILT-IN HARD DENYLIST: independently of this file, the engine denies in
# code, for reads AND writes: /var/lib/vibeos/audit/**,
# /var/lib/vibeos/approvals/** (agents must not read or forge approval grants),
# /etc/shadow*,
# /etc/gshadow*, **/.ssh/**, **/.gnupg/**, /etc/ssh/* (+ /etc/ssh/ssh_host_*),
# **/.aws/**, **/.config/gcloud/**,
# /etc/NetworkManager/system-connections/**, /etc/krb5.keytab, /etc/sssd/**,
# /etc/ipsec.secrets, /etc/ipsec.d/private/**, /etc/pki/**/private/**,
# **/.docker/config.json,
# **/.kube/config, **/.netrc, /root/**, /proc/*/environ, /proc/**/environ,
# /proc/**/cmdline, kernel-memory pseudo-files (/proc/kcore, /proc/kallsyms,
# /proc/kmsg, /proc/*/mem, /proc/*/pagemap), per-user runtime dirs
# (/run/user/**, /run/secrets/**), /run/credentials/**, /boot/**, plus the
# credentials of the AI agents / dev tooling shipped in the image: **/.claude/**,
# **/.claude.json, **/.config/gh/**, **/.gemini/**, **/.codex/**,
# **/.local/share/opencode/**, **/.ollama/**, **/.npmrc, **/.git-credentials,
# **/.config/sops/** ; and for WRITES only:
# /etc/vibeos/policy.d/** and /var/lib/vibeos/memory/**.
# fs.write is ADDITIONALLY confined to the calling user's own home directory
# (resolved from /etc/passwd via SO_PEERCRED) and is symlink-safe (the parent
# is canonicalized and the final component opened with O_NOFOLLOW).
# The `denied` lists below mirror it as defense in depth; editing them does
# NOT re-enable access.
#
# Glob syntax: `*` matches within one path segment, `**` matches across
# segments. Same matcher for tool names and paths.
#
# SECURITY INVARIANTS (do not weaken without a threat-model review):
#   * The implicit and explicit default is DENY.
#   * Agents can never read the audit trail, and can never write the audit
#     trail, the memory volume or the policy directory.
#   * T2/T3 actions always require out-of-band human approval.

schema_version = 1

[meta]
name = "default"
description = "Baseline VibeOS policy for the v0.1 tool surface (capability tiers T0-T3)."

# ---------------------------------------------------------------------------
# Rules — evaluated in order, la premiere regle qui matche gagne.
# ---------------------------------------------------------------------------

# --- T0: observation --------------------------------------------------------

[[rule]]
id = "os-status"
tools = ["os.status"]
tier = "T0"
action = "allow"
reason = "Read-only system introspection; no state change of any kind."

[[rule]]
id = "fs-read"
tools = ["fs.read", "fs.list"]
tier = "T0"
action = "allow"
reason = "Read-only file access and directory listing outside the audit trail, secret stores and key material (same denylist for both tools)."

# Mirrors the built-in hard denylist (enforced in code even without this list).
[rule.paths]
denied = [
  "/var/lib/vibeos/audit/**",  # audit trail: agents must never read or probe it
  "/var/lib/vibeos/approvals/**", # approval store: agents must not read or forge grants
  "/etc/shadow*",              # /etc/shadow and /etc/shadow- (password hashes)
  "/etc/gshadow*",             # group password hashes
  "**/.ssh/**",                # SSH key material, wherever it lives
  "**/.gnupg/**",              # GnuPG key material, wherever it lives
  "/etc/ssh/*",                # sshd config AND host keys
  "/etc/ssh/ssh_host_*",       # host private keys (explicit)
  "**/.aws/**",                # AWS credentials, config, SSO cache — whole dir
  "**/.config/gcloud/**",      # Google Cloud credentials store
  "/etc/NetworkManager/system-connections/**", # Wi-Fi/VPN PSKs and certs
  "/etc/krb5.keytab",          # Kerberos service keys
  "/etc/sssd/**",              # SSSD: LDAP/AD bind credentials
  "/etc/ipsec.secrets",        # IPsec PSK/keys
  "/etc/ipsec.d/private/**",   # IPsec private keys
  "/etc/pki/**/private/**",    # TLS/PKI private keys (public certs stay readable)
  "**/.docker/config.json",    # container registry auth tokens (Docker)
  "**/.config/containers/auth.json", # Podman/skopeo/buildah registry authfile (Podman-first image)
  "**/.kube/config",           # kubernetes cluster credentials
  "**/.netrc",                 # machine login credentials
  "/root/**",                  # root's home directory
  "/var/roothome/**",          # canonical form of /root on OSTree (matcher is alias-blind)
  "/proc/*/environ",           # process environments may leak secrets
  "/proc/**/environ",          # ...including /proc/<pid>/task/<tid>/environ
  "/proc/**/cmdline",          # command lines may carry secrets/tokens
  # Kernel-memory pseudo-files: vibed reads as root → kernel memory / KASLR to
  # any caller. Per-user runtime dirs (0700) → cross-user. (Review 2026-07-14.)
  "/proc/kcore",               # kernel core image (physical RAM)
  "/proc/kallsyms",            # kernel symbol addresses (defeats KASLR)
  "/proc/kmsg",                # kernel ring buffer
  "/proc/*/mem",               # a process's address space
  "/proc/**/mem",              # ...including per-thread task/<tid>/mem
  "/proc/*/pagemap",           # virtual->physical page mapping
  "/proc/**/pagemap",
  "/run/user/**",              # XDG_RUNTIME_DIR of every user (mode 0700)
  "/run/secrets/**",           # systemd/container secrets convention
  "/run/credentials/**",       # decrypted systemd-creds exposed to services
  "/boot/**",                  # boot chain is none of the agent's business
  # Credentials of the AI agents / dev tooling shipped in the image — vibed
  # runs as root and fs.read is not confined to the caller's home, so these
  # must be unreadable across ALL homes.
  "**/.claude/**",             # Claude Code state: OAuth token, transcripts
  "**/.claude.json",           # Claude Code top-level config may carry keys
  "**/.config/gh/**",          # GitHub CLI hosts.yml (oauth_token)
  "**/.gemini/**",             # gemini-cli oauth_creds.json
  "**/.codex/**",              # codex auth.json
  "**/.local/share/opencode/**", # opencode auth.json + agent-internal state
  "**/.ollama/**",             # ollama keypair (id_ed25519)
  "**/.npmrc",                 # npm registry authTokens
  "**/.git-credentials",       # plaintext git credentials store (home-root)
  "**/.config/git/credentials", # git-credential-store XDG fallback
  "**/.config/sops/**",        # SOPS/age private keys (keys.txt)
]

[[rule]]
id = "svc-status"
tools = ["svc.status"]
tier = "T0"
action = "allow"
reason = "Read-only systemd unit state (systemctl show); no state change, strict unit-name validation in code."

[[rule]]
id = "log-read"
tools = ["log.read"]
tier = "T0"
action = "allow"
reason = "Agent self-debugging (ADR-011): read its OWN units' journal, allowlisted + bounded + best-effort redacted. Exfiltration-sensitive — the allowlist below is the real control."

# ADR-011 unit ALLOWLIST (default-deny): log.read may return ONLY these units'
# journals — never the full system journal, never another user's unit. A unit
# absent here is DENIED before the tier floor (see policy.rs apply_rule). Keep
# this list narrow and free of units known to log secrets. Globs per glob.rs.
[rule.services]
allowed = [
  "vibed.service",           # the daemon itself
  "vibeos-agent@*.service",  # the user's own governed agent units
]

[[rule]]
id = "sectools-list"
tools = ["sectools.list"]
tier = "T0"
action = "allow"
reason = "Read-only discovery of the security toolkit manifest; executes no tool. Running a security tool is a separate, policy-gated path (T2/T3 = human approval)."

# --- T1: user-scope mutation ------------------------------------------------

[[rule]]
id = "fs-write"
tools = ["fs.write"]
tier = "T1"
action = "allow"
reason = "Writes are confined to user files under /home (and /var/home, its target on Fedora)."

[rule.paths]
allowed = [
  "/home/**",
  "/var/home/**",  # Fedora: /home is a symlink to /var/home; accept both spellings
]
# Defense in depth: these paths can never match `allowed` above, and the
# built-in denylist blocks them in code anyway. Kept explicit so the
# invariant stays visible where policies are edited. The memory volume is
# not writable via fs.write; memory writes go through memory.append
# (rule below), which takes no path argument.
denied = [
  "/var/lib/vibeos/memory/**",
  "/var/lib/vibeos/audit/**",
  "/etc/vibeos/policy.d/**",
  "/var/lib/vibeos/mode.json", # no-self-escalation (ADR-027): an agent must never write itself into open mode
]

[[rule]]
id = "sandbox-probe"
tools = ["sandbox.probe"]
tier = "T1"
action = "allow"
reason = "ADR-019 confinement self-test: a FIXED trusted helper (/usr/libexec/vibed-tool) with a FIXED argv and empty stdin, no credential, no target, no network beyond the deny-floor, ephemeral (RuntimeMaxSec/MemoryMax + per-uid rate limiter). Its radius is below fs.write. T1 holds ONLY while the argv/binary/stdin stay fixed — a future generic mode is T2 minimum."

[[rule]]
id = "memory-query"
tools = ["memory.query"]
tier = "T0"
action = "allow"
reason = "Read-only query against the VibeOS memory store."

[[rule]]
id = "agent-thinking"
tools = ["agent.thinking"]
tier = "T0"
action = "allow"
reason = "Read-only, bounded tail of an autonomous session's captured reasoning (memory/reasoning/, written by the supervisor). session_id is charset-validated; no path argument."

[[rule]]
id = "agent-observability"
tools = ["agent.sessions", "agents.list", "agent.activity"]
tier = "T0"
action = "allow"
reason = "Read-only HUD/self observability, all CONFINED to the caller's own uid. agent.sessions lists reasoning-session ids (discovery for agent.thinking). agents.list is a per-uid roster (other pids) derived from the audit trail. agent.activity is the caller's OWN recent governed tool calls incl. its refusals (ADR-026) — the 'deeds' half of AI-citizen self-knowledge, exposing nothing agents.list would not for the same uid. Bounded output, rate-limited like any tool."

[[rule]]
id = "policy-check"
tools = ["policy.check"]
tier = "T0"
action = "allow"
reason = "Read-only classification of a hypothetical (tool, target) call — returns the policy decision + tier without executing, approving, or touching the approval store. A hint for the governed editor auto-mode (ADR-014); real enforcement stays at execution."

[[rule]]
id = "policy-capabilities"
tools = ["policy.capabilities"]
tier = "T0"
action = "allow"
reason = "Read-only capability manifest DERIVED from the loaded policy (tools/tier/approval/target constraints) so the agent plans in reality instead of discovering limits by refusal. Indicative only; the authoritative decision stays the per-call evaluation, so it can never over-promise."

[[rule]]
id = "user-model"
tools = ["user.model"]
tier = "T0"
action = "allow"
reason = "Read-only, DERIVED and TRANSPARENT model of how the human works, for symbiosis (ADR-028). Folded from data VibeOS already holds under governance — the user-memory profile and the audit trail CONFINED to the caller's uid — plus recent typed journal notes; anticipations are a deterministic frequency×recency heuristic, never a trained predictor. No NEW leak (same underlying data as memory.query + agent.activity for the same uid), no new surveillance (never the human's raw keystrokes), local and user-owned (the memory belongs to its user). Bounded output, rate-limited like any tool."

[[rule]]
id = "memory-append"
tools = ["memory.append"]
tier = "T1"
action = "allow"
reason = "Strictly additive, scope-based write into the memory store (journal/knowledge JSONL). No path argument, no delete, no rewrite; identity/hardware stay Genesis-only and vibed stamps the timestamps."

# --- T2: system-scope mutation (human approval is a hard floor) -------------

[[rule]]
id = "pkg-install"
tools = ["pkg.install"]
tier = "T2"
action = "allow"
approval = "human"
reason = "Package installation requires explicit out-of-band human approval."

[[rule]]
id = "svc-restart"
tools = ["svc.restart"]
tier = "T2"
action = "allow"
approval = "human"
reason = "Service restarts require human approval; access-, audit- and approval-critical units can never be restarted by agents (denied BEFORE the approval floor: an agent cannot even queue an approval request for them)."

# Non-negotiable deny-list: a matching unit is DENIED outright (policy.rs
# apply_rule checks service.denied BEFORE the T2 approval floor), so an agent
# cannot even put these into the approval queue. THREE axes:
#   (1) units whose restart would CUT the operator's ACCESS to the machine or to
#       the approval path;
#   (2) the warden/audit pipeline itself;
#   (3) units whose restart would GRANT new access. `systemctl restart` on an
#       INACTIVE unit is a START — so a "restart" is not only a way to take
#       something away, it is also a way to turn something ON. Axes (1) and (2)
#       both reason about removal/tampering; this one is their inverse and was
#       missing (added 2026-07-15).
# Glob patterns allowed.
#
# NOTE ON SHAPE — this is a DENY-list, i.e. enumerate-the-bad, while the project's
# canonical rule is default-deny (and `log.read` above rightly uses `allowed`, an
# allow-list). Enumeration cannot be complete: axis (3) in particular is
# unbounded (any inactive access-granting unit present in the image). What caps
# the damage is NOT this list — it is the T2 human floor: a miss here does not
# grant a restart, it only lets the agent ASK. This list's real job is to stop an
# agent from social-engineering the operator into approving something
# catastrophic. Turning `svc.restart` into an allow-list would be structurally
# correct, but requires deciding WHICH units an agent may ever restart — an
# operator decision, deliberately not taken here.
[rule.services]
denied = [
  # Warden + approval mechanism — an agent must never touch what governs it.
  "vibed.service",              # the policy warden + approval store owner
  # The `vibeos-` prefix is a RESERVED NAMESPACE: no agent may restart anything
  # in it. This is a prefix glob rather than an enumeration on purpose — the
  # enumeration is exactly what failed. `vibeos-agent@*.service` did NOT cover
  # `vibeos-agent-egress@*.service` (the glob wants `@` where the text has
  # `-egress@`), so an agent could ask to restart the very unit that compiles its
  # own egress allow-list. Someone added a governance unit and did not think to
  # come back here; a namespace claim makes the next one denied by default.
  # Cost: a unit named `vibeos-*` that is NOT ours can never be restarted by an
  # agent either. That is the intended trade — the prefix is ours.
  "vibeos-*",                   # supervisor, egress warden, group setup, genesis
  "polkit.service",             # authorization backbone
  # Audit / log pipeline — tamper resistance.
  "systemd-journald.service",   # log pipeline stays out of reach
  "auditd.service",             # audit pipeline stays out of reach
  # Operator ACCESS — restarting any of these can lock the human out, removing
  # the very ability to approve or intervene.
  "sshd.service",               # remote SSH access
  # ...and its socket. Axis (3): SSH may be installed but INACTIVE, and a
  # "restart" of an inactive unit STARTS it — an approved `svc.restart
  # sshd.socket` reads as innocuous to an operator while it actually turns
  # remote SSH ON. Denying the .service alone only covered the removal axis.
  "sshd.socket",                # socket activation would START ssh, not cut it
  "NetworkManager.service",     # network (remote access) — common impl
  "systemd-networkd.service",   # network — alternative impl
  "display-manager.service",    # the graphical session where approval happens
  "sddm.service",               # the shipped display manager (concrete alias)
  "systemd-logind.service",     # login/session management
  "user@*.service",             # the per-user systemd manager — restarting it
                                # tears down the operator's session, i.e. the very
                                # place `vibectl approve` / the HUD run
  # System bus — the machine (and vibed's own D-Bus calls) depend on it.
  "dbus-broker.service",        # Fedora 42 system bus
  "dbus.service",               # alternative bus implementation
  "dbus.socket",                # the bus is socket-activated: deny the socket too
]

# --- Catch-all: everything not explicitly allowed above is denied -----------

[[rule]]
id = "default-deny"
tools = ["*"]
tier = "T3"  # informational on a deny rule; the action is what matters
action = "deny"
reason = "No policy rule allows this tool. The engine denies unmatched tools even without this rule; it exists so the refusal is explicit and self-documenting in the audit trail."
