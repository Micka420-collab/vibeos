; VibeOS — SDDM theme configuration
; =============================================================================
; Target (image build): /usr/share/sddm/themes/vibeos/theme.conf
; Source: desktop/sddm/vibeos/theme.conf (COPY-ed into the image).
; Status: ✅ ACTIVE (2026-07-23). Values here are exposed to Main.qml as the
; `config` context object (e.g. config.background). All keys are optional and
; have safe fallbacks in Main.qml — the theme renders even with no config.
;
; Honesty: `Font` is the aspirational Inter (font-sans, DESIGN-SYSTEM §3.1),
; resolved by fontconfig to Noto Sans until Inter is packaged in the image.
; =============================================================================
[General]
; Backdrop. Empty on purpose: VibeOS paints the "Genesis" aurora procedurally
; (grad-mesh-genesis, §7) in Main.qml — no bitmap wallpaper is shipped for login.
; Set an absolute path here only to override with a still image.
background=
type=color
color=#11111b

; UI fonts consumed by Main.qml (kept here so branding can retune without QML edits).
Font=Inter
FontMono=JetBrains Mono

; Cosmetic knobs (reserved for Phase 5 tuning; Main.qml reads them defensively).
ScaleImageCropped=true
