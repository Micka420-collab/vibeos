# ci.yml — Code-level CI for VibeOS:
#   * rust        vibed daemon (fmt --check + build + tests + clippy
#                 --all-targets -D warnings, tout en --locked : le Cargo.lock
#                 commité fait foi, jamais régénéré silencieusement). The
#                 integration test suite loads the shipped policy file
#                 security/policy.d/default.toml through the REAL parser, so a
#                 policy/parser mismatch fails this job.
#   * audit       cargo audit (RustSec advisories) sur le Cargo.lock épinglé —
#                 critère de sortie Phase 2 (ROADMAP.md §4).
#   * hud-client  desktop/quickshell/vibed_client.js sous node (c'est une
#                 `.pragma library` : de l'ECMAScript pur, donc exécutable sans
#                 Qt). Seul contrôle automatisé de la couche qui traduit le
#                 format de vibed en ce que l'utilisateur lit ; le RENDU QML
#                 reste machine-gated (pas de Quickshell headless).
#   * zed-extension
#                 zed/vibeos-claude-acp (TypeScript): tsc --noEmit + the vitest
#                 suite (governance gate + layer-3 insight mappers). The
#                 in-editor rendering stays machine-gated (Tier B).
#   * shellcheck  memory/genesis.sh (first-boot Genesis script) and
#                 os/rootfs/usr/bin/vibeos-hud (HUD launcher)
#   * threatmodel-tools (step in the rust job) — every tool exposed by the MCP
#                 catalog (build_tool_catalog) has a row in docs/THREAT-MODEL.md
#                 §6. Turns the documented-but-unenforced "each tool adds its
#                 row before merge" rule into a real guard.
#   * policy      quick schema validation of security/policy.d/*.toml with
#                 Python tomllib (canonical [[rule]] schema: id / tools /
#                 tier / action / approval), mirroring vibed's fail-closed
#                 load rules.
#   * containers-policy
#                 the client-side cosign verification policy, shipped STAGED
#                 (os/rootfs/usr/share/vibeos/containers/policy-strict.json +
#                 registries.d/anchors under os/rootfs/etc/): structure checks,
#                 pinned sigstore trust anchors, and a MECHANICAL skopeo proof
#                 that an unsigned image is rejected by the
#                 ghcr.io/micka420-collab/vibeos requirement. The effect on a
#                 real `bootc upgrade` (deployed machine) stays machine-gated.

name: ci

on:
  push:
    paths:
      - "vibed/**"
      - "memory/**"
      - "security/**"
      - "os/rootfs/usr/bin/**"
      - "os/rootfs/usr/libexec/**"
      - "os/rootfs/usr/lib/systemd/system-generators/**"
      # Sans ces deux entrees, une PR qui ne toucherait QUE ces fichiers ne
      # declencherait pas ce workflow — et les deux garde-fous ci-dessous ne
      # tourneraient JAMAIS sur les fichiers qu'ils surveillent. C'est deja
      # arrive : le correctif qui ajoutait `os/Containerfile` a ete pousse APRES
      # le merge de sa PR et n'a jamais atterri, laissant le controle EOL
      # aveugle sur un changement de base.
      - "os/Containerfile"
      - "os/security-tools.txt"
      - "os/saas-tools.txt"
      # `image-info.json` (sous usr/lib/vibeos) porte le MÊME digest de base que
      # le Containerfile, et check-base-digest-sync.py garde leur accord. Sans
      # cette entrée, éditer le seul JSON — désynchroniser le digest — ne
      # déclencherait aucun workflow. Exactement le trou décrit au-dessus.
      - "os/rootfs/usr/lib/vibeos/**"
      # Sans cette entrée, une PR qui ne touche QUE les modèles compose ne
      # déclenche pas ci.yml — et check-saas-compose.py (le garde loopback-only)
      # ne tournerait JAMAIS sur les fichiers qu'il garde. Même trou que pour
      # os/Containerfile plus haut.
      - "os/rootfs/usr/share/vibeos/saas/**"
      # THREAT-MODEL.md est gardé par check-threatmodel-tools.py : l'éditer seul
      # (retrait d'une ligne d'outil) doit déclencher le garde.
      - "docs/THREAT-MODEL.md"
      # Policy de vérification cosign côté client + ancres sigstore : sans ces
      # entrées, une PR qui n'affaiblirait QUE la policy ne déclencherait
      # jamais le job containers-policy qui la garde. Même trou que pour
      # os/Containerfile plus haut. La policy STRICTE vit en STAGED sous
      # usr/share/vibeos/containers — l'oublier ici referait le trou.
      - "os/rootfs/etc/containers/**"
      - "os/rootfs/etc/pki/**"
      - "os/rootfs/usr/share/vibeos/containers/**"
      # Extension Zed : sans cette entrée, une PR qui ne touche QUE zed/**
      # ne déclencherait jamais le job zed-extension qui la teste.
      - "zed/**"
      - "desktop/quickshell/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "vibed/**"
      - "memory/**"
      - "security/**"
      - "os/rootfs/usr/bin/**"
      - "os/rootfs/usr/libexec/**"
      - "os/rootfs/usr/lib/systemd/system-generators/**"
      # Sans ces deux entrees, une PR qui ne toucherait QUE ces fichiers ne
      # declencherait pas ce workflow — et les deux garde-fous ci-dessous ne
      # tourneraient JAMAIS sur les fichiers qu'ils surveillent. C'est deja
      # arrive : le correctif qui ajoutait `os/Containerfile` a ete pousse APRES
      # le merge de sa PR et n'a jamais atterri, laissant le controle EOL
      # aveugle sur un changement de base.
      - "os/Containerfile"
      - "os/security-tools.txt"
      - "os/saas-tools.txt"
      # `image-info.json` (sous usr/lib/vibeos) porte le MÊME digest de base que
      # le Containerfile, et check-base-digest-sync.py garde leur accord. Sans
      # cette entrée, éditer le seul JSON — désynchroniser le digest — ne
      # déclencherait aucun workflow. Exactement le trou décrit au-dessus.
      - "os/rootfs/usr/lib/vibeos/**"
      # Sans cette entrée, une PR qui ne touche QUE les modèles compose ne
      # déclenche pas ci.yml — et check-saas-compose.py (le garde loopback-only)
      # ne tournerait JAMAIS sur les fichiers qu'il garde. Même trou que pour
      # os/Containerfile plus haut.
      - "os/rootfs/usr/share/vibeos/saas/**"
      # THREAT-MODEL.md est gardé par check-threatmodel-tools.py : l'éditer seul
      # (retrait d'une ligne d'outil) doit déclencher le garde.
      - "docs/THREAT-MODEL.md"
      # Policy de vérification cosign côté client + ancres sigstore : sans ces
      # entrées, une PR qui n'affaiblirait QUE la policy ne déclencherait
      # jamais le job containers-policy qui la garde. Même trou que pour
      # os/Containerfile plus haut. La policy STRICTE vit en STAGED sous
      # usr/share/vibeos/containers — l'oublier ici referait le trou.
      - "os/rootfs/etc/containers/**"
      - "os/rootfs/etc/pki/**"
      - "os/rootfs/usr/share/vibeos/containers/**"
      # Extension Zed : sans cette entrée, une PR qui ne touche QUE zed/**
      # ne déclencherait jamais le job zed-extension qui la teste.
      - "zed/**"
      - "desktop/quickshell/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# Un seul run par branche : un push rapproché annule le run précédent (les
# minutes CI sont comptées, cf. ROADMAP.md §3 garde-fous).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: vibed — fmt, build, test, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-07-08)
        with:
          components: clippy, rustfmt

      - name: Format (check only)
        run: cargo fmt --check

      # --locked partout : si Cargo.lock est désynchronisé de Cargo.toml, la CI
      # échoue au lieu de régénérer le lock et de tester d'autres versions que
      # celles épinglées (posture supply-chain, SECURITY.md).
      - name: Build
        run: cargo build --locked

      # Includes the integration test that loads the repository's
      # security/policy.d/default.toml with the real policy engine.
      - name: Test
        run: cargo test --locked

      # --all-targets : le code des tests (nombreux tests unitaires +
      # intégration) est linté au même niveau que le code de production.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Tout ce qui précède compile la configuration DE PRODUCTION (sans
      # `dev-overrides`) — c'est bien ce qu'on veut valider en premier, puisque
      # c'est ce que l'image livre. Mais du coup rien ne compilerait jamais le
      # chemin `dev-overrides`, qui pourrirait en silence jusqu'à casser le
      # harnais E2E Zed (le seul à l'activer, et il n'est pas joué en CI —
      # machine-gated Tier B). Ce lint le maintient vivant sans jamais l'expédier.
      - name: Clippy — dev-overrides feature (harnais E2E, jamais expédié)
        run: cargo clippy --all-targets --locked --features dev-overrides -- -D warnings

      # Critère de sortie Phase 2 (ROADMAP §4) : « Aucune fuite d'informations
      # sensibles (tokens, contenus de fichiers) dans les logs de niveau info. »
      # Vrai le 2026-07-15, vérifié en relisant les 26 appels tracing de
      # vibed/src — mais vrai PAR DISCIPLINE : rien n'empêchait le prochain
      # `info!("… args={args}")` d'expédier les arguments d'outil dans le
      # journal. Un critère vrai seulement jusqu'à ce que quelqu'un oublie n'est
      # pas un critère, c'est une coïncidence.
      - name: Hygiène des logs (aucun secret loggé)
        working-directory: .
        run: python3 scripts/check-log-hygiene.py

      # THREAT-MODEL.md §6 énonce « chaque outil MCP exposé ajoute sa ligne au
      # tableau §6 avant merge » — règle réelle mais qui était NON EXÉCUTÉE, et
      # qui avait dérivé (la moitié du catalogue sans ligne). Ce garde la rend
      # exécutable : un outil du catalogue `build_tool_catalog` sans ligne §6
      # fait rougir la CI.
      - name: Outils MCP tous dans le modèle de menace
        working-directory: .
        run: python3 scripts/check-threatmodel-tools.py

      # Le 2026-07-15, VibeOS construisait depuis 49 jours sur Fedora Kinoite 42,
      # EOL le 2026-05-27 — zéro correctif de sécurité, et AUCUN signal : quand
      # une release passe EOL, MirrorManager continue de répondre et redirige
      # vers les miroirs d'ARCHIVE. `dnf install` renvoie 0 et installe des
      # paquets gelés à la date d'EOL. Le build ne PEUT pas échouer tout seul ;
      # l'image se fossilise pendant que la CI reste verte. D'où ce contrôle :
      # c'est la seule chose qui puisse le dire.
      - name: Base Fedora supportée (pas EOL)
        working-directory: .
        run: bash scripts/check-base-eol.sh os/Containerfile

      # Le digest de base est épinglé à DEUX endroits : os/Containerfile (FROM +
      # label OCI) et os/rootfs/usr/lib/vibeos/image-info.json, la carte
      # d'identité lue à l'exécution. bump-base-digest.sh ne réécrivait que le
      # premier : à chaque purge quay suivie d'un bump, le JSON gardait l'ANCIEN
      # digest et l'image annonçait une base qui n'était pas la sienne. Dérive
      # muette, invisible en CI. Ce garde exige un seul digest partout, ET que
      # tout nouveau site d'épinglage soit connu du bumpeur. Zéro réseau (la
      # résolution du digest, elle, est le cron base-digest-fresh).
      - name: Digest de base — un seul, partout, et bumpable
        working-directory: .
        run: python3 scripts/check-base-digest-sync.py

      # Le garde-fou des garde-fous. Ce dépôt a accumulé 5 checks mécaniques,
      # chacun câblé À LA MAIN — le motif « garder en synchro » qui a dérivé
      # partout ailleurs. Ce méta-check refuse un `check-*`/`verify-*` non exécuté
      # en CI : un garde-fou que la CI ne lance jamais ne garde rien (c'est
      # arrivé à check-base-eol lui-même). Contrat : scripts/README.md.
      - name: Garde-fous tous câblés en CI
        working-directory: .
        run: python3 scripts/check-guards-wired.py

      # `os/Containerfile` demandait poliment, en commentaire : « Keep
      # os/security-tools.txt in strict sync with this list. » Une exigence
      # MANUELLE que rien n'appliquait — et qui a dérivé la PREMIÈRE fois que
      # quelqu'un a touché la liste : le rebase f42->f44 a retiré nbtscan,
      # wfuzz et scalpel du Containerfile (Fedora les a retirés d'amont) sans
      # toucher au manifeste, qui a continué d'annoncer 61 outils pour 58
      # installés. Un commentaire qui demande une synchro n'est pas une synchro.
      - name: Trousse cybersécurité — manifeste == couche installée
        working-directory: .
        run: python3 scripts/check-sectools-sync.py

      # Même exigence pour le touseau SaaS (couche 1d-ter / os/saas-tools.txt) :
      # « garder en synchro » n'est une synchro que si un check l'applique.
      - name: Touseau SaaS — manifeste == couche installée
        working-directory: .
        run: python3 scripts/check-saas-sync.py

      # Sécurité : chaque modèle compose de la trousse SaaS ne publie ses ports
      # QUE sur la loopback (127.0.0.1). Un modèle qui exposerait une base (souvent
      # sans mot de passe fort en dev) sur 0.0.0.0 la mettrait sur tout le réseau
      # local. Laissée en convention de revue, la règle dérive au premier modèle
      # ajouté ; ce garde la rend exécutable (et fail-closed).
      - name: Modèles compose SaaS — ports loopback-only
        working-directory: .
        run: python3 scripts/check-saas-compose.py

  audit:
    name: vibed — cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vibed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-07-08)

      # Prebuilt binary — no from-source recompile of cargo-audit and its ~200
      # deps on every run (cohérent avec la politique de pins SHA du dépôt).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  msrv:
    name: vibed — MSRV (Rust 1.75) build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verify the rust-version = "1.75" declared in Cargo.toml actually builds
      # and tests (the `rust` job uses stable; this locks the floor). Cargo.lock
      # pins indexmap/hashbrown to versions compatible with 1.75 — see Cargo.toml.
      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.75.0
      - name: Build (locked)
        run: cargo build --locked
      - name: Test (locked)
        run: cargo test --locked

  hud-client:
    name: HUD client (JS) — mappers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # desktop/quickshell/vibed_client.js is a QML `.pragma library`: plain
      # ECMAScript, so it runs under the runner's preinstalled node without Qt.
      # This is the ONLY automated check on the layer that turns vibed's wire
      # format into what the user reads — the QML rendering itself stays
      # machine-gated (no Quickshell headless). No new toolchain: node ships
      # with ubuntu-latest.
      - name: HUD client checks
        run: node scripts/check-hud-client.js

  # The Zed extension (governance gate + layer-3 insight mappers) had a full
  # vitest suite that NO CI job ever executed — the README's "N Zed tests"
  # claim rested on manual runs alone, the same silent-bypass class the other
  # paths: comments in this file document. tsc --noEmit types the whole
  # extension; vitest runs the suite. npm ci obeys the committed lockfile
  # (supply-chain posture, same reasoning as --locked for cargo).
  zed-extension:
    name: Zed extension (TS) — types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zed/vibeos-claude-acp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm test

  shellcheck:
    name: scripts shell — shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # DÉCOUVERTE, pas liste. Cette étape énumérait 9 scripts À LA MAIN. Deux y
      # échappaient déjà — dont `scripts/check-base-eol.sh`, le garde-fou EOL,
      # exécuté en CI mais jamais linté : le fichier qui protège la base n'était
      # pas protégé lui-même. Une liste hardcodée est le motif « garder en
      # synchro » qui a dérivé partout ailleurs ce mois-ci. On la remplace par la
      # découverte : tout script shell suivi par git (shebang sh/bash, ou
      # extension .sh, hors node_modules) est linté — un script ajouté demain
      # l'est sans que personne y pense.
      - name: shellcheck (tous les scripts shell du dépôt)
        run: |
          mapfile -d '' files < <(
            git ls-files -z -- \
              'memory/**' 'os/**' 'scripts/**' 'zed/**' \
            | while IFS= read -r -d '' f; do
                case "$f" in
                  */node_modules/*) continue ;;
                esac
                case "$f" in
                  *.sh) printf '%s\0' "$f" ;;
                  *) if head -c 2 -- "$f" 2>/dev/null | grep -q '#!' \
                        && head -1 -- "$f" | grep -qE '#!.*(bash|/sh|env (bash|sh))'; then
                       printf '%s\0' "$f"
                     fi ;;
                esac
              done
          )
          printf 'shellcheck sur %d script(s) :\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

      # Non-regression smoke test of the Genesis sequence: run it into a throwaway
      # dir and assert the layout, the hardware.json schema-2 structured fields,
      # idempotency (a second run is a no-op) and the amnesic-mode marker.
      - name: Genesis smoke test
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          VIBEOS_MEMORY_DIR="$T/mem" bash memory/genesis.sh
          test -f "$T/mem/.initialized"
          # Interview contract (a): a DEFAULT first boot — no TTY on stdin, no
          # VIBEOS_INTERVIEW=1 — must not create user/updates.jsonl at all. The
          # interview is opt-in; an unattended boot writes nothing to user/.
          test ! -e "$T/mem/user/updates.jsonl"
          python3 - "$T/mem" <<'PY'
          import json, sys, pathlib
          root = pathlib.Path(sys.argv[1])
          hw = json.loads((root / "hardware.json").read_text())
          assert hw["schema"] == 2, f"hardware.json schema must be 2, got {hw['schema']}"
          assert isinstance(hw["cpu"]["cores"], int), "cpu.cores must be an integer"
          assert "total_bytes" in hw["memory"], "memory.total_bytes missing"
          assert isinstance(hw["gpu"], list), "gpu must be an array"
          assert set(hw["raw"]) >= {"cpu", "memory", "block_devices", "filesystems"}
          # journal genesis event present
          import glob
          j = glob.glob(str(root / "journal" / "*.jsonl"))
          assert j, "no journal file written"
          ev = json.loads(open(j[0]).read().splitlines()[0])
          assert ev["type"] == "genesis" and ev["source"] == "genesis.sh"
          # The genesis event carries the born character (name/archetype/seed).
          persona = ev["data"]["personality"]
          assert persona["name"] and persona["archetype"] and persona["seed"], persona
          # personality.toml — the AI citizen's birth character (§3.8).
          import re
          p = (root / "personality.toml").read_text()
          def field(name):
              m = re.search(rf'^{name} = "(.*)"$', p, re.M)
              assert m, f"{name} missing from personality.toml"
              return m.group(1)
          assert re.search(r"^schema = 1$", p, re.M), "personality schema must be 1"
          name, archetype, tone = field("name"), field("archetype"), field("tone")
          assert "[traits]" in p and "[adaptation]" in p, "traits/adaptation tables"
          traits = {}
          for axis in ("curiosity", "caution", "initiative", "warmth", "concision", "playfulness"):
              v = int(re.search(rf"^{axis} = (\d+)$", p, re.M).group(1))
              assert 0 <= v <= 100, f"{axis} out of range: {v}"
              traits[axis] = v
          assert traits["caution"] >= 50, f"caution floor is 50, got {traits['caution']}"
          # Archetype must be the dominant axis, first-max-wins (mirrors the -gt
          # chain in genesis.sh): a wrong-but-stable label would pass a mere
          # presence check and survive the determinism diff.
          order = [("caution", "sentinelle"), ("curiosity", "exploratrice"),
                   ("initiative", "stratège"), ("warmth", "compagne"),
                   ("concision", "artisane"), ("playfulness", "muse")]
          best_axis, best_arch, best_val = order[0][0], order[0][1], traits[order[0][0]]
          for axis, arch in order[1:]:
              if traits[axis] > best_val:
                  best_axis, best_arch, best_val = axis, arch, traits[axis]
          assert archetype == best_arch, f"archetype {archetype!r} != dominant {best_arch!r} ({traits})"
          # Tone follows the threshold ladder in genesis.sh.
          if traits["concision"] >= 66: exp_tone = "concis et direct"
          elif traits["warmth"] >= 66: exp_tone = "chaleureux et pédagogue"
          elif traits["playfulness"] >= 66: exp_tone = "vif et curieux"
          else: exp_tone = "posé et précis"
          assert tone == exp_tone, f"tone {tone!r} != expected {exp_tone!r} ({traits})"
          # The journal's character must AGREE with personality.toml (a reordered
          # printf arg would otherwise pass the truthiness check above).
          assert persona["name"] == name, (persona["name"], name)
          assert persona["archetype"] == archetype, (persona["archetype"], archetype)
          assert persona["seed"] == field("seed"), (persona["seed"], field("seed"))
          print("Genesis smoke test OK")
          PY

          # fnv1a32 known-answer test: the determinism diff proves two runs AGREE,
          # not that the hash is CORRECT. Pin canonical FNV-1a/32 vectors so a
          # wrong offset/prime/mask (still deterministic) is caught.
          eval "$(sed -n '/^fnv1a32() {/,/^}/p' memory/genesis.sh)"
          for pair in ":2166136261" "a:3826002220" "foobar:3214735720" "hello:1335831723"; do
            in="${pair%%:*}"; want="${pair##*:}"; got="$(fnv1a32 "$in")"
            test "$got" = "$want" || { echo "FAIL fnv1a32('$in')=$got want $want"; exit 1; }
          done
          echo "Genesis fnv1a32 known-answer OK"

          # The awakening (birth_ceremony) is delivered but called `|| true`, so a
          # future breakage would print nothing and stay green. Capture stderr and
          # assert it ran to the LAST line (the manifesto), proving no mid-abort.
          VIBEOS_MEMORY_DIR="$T/mem4" bash memory/genesis.sh 2>"$T/awaken.log" >/dev/null
          grep -q "un citoyen s'éveille" "$T/awaken.log"
          grep -q '▓' "$T/awaken.log"      # trait gauges rendered
          grep -q 'Apprenons-nous' "$T/awaken.log"  # printed LAST → block completed
          grep -qF "$(sed -n 's/^name = "\(.*\)"$/\1/p' "$T/mem4/personality.toml")" "$T/awaken.log"
          echo "Genesis awakening OK (ceremony ran to completion)"
          # Idempotency, take 1 — the GUARD: with the sentinel present the script
          # must exit immediately and touch nothing.
          before="$(find "$T/mem" -type f | sort | xargs sha256sum)"
          VIBEOS_MEMORY_DIR="$T/mem" bash memory/genesis.sh
          after="$(find "$T/mem" -type f | sort | xargs sha256sum)"
          test "$before" = "$after"  # no rewrite on second run

          # Idempotency, take 2 — RE-ENTRANCY, which take 1 never reached.
          # Removing the sentinel simulates the real crash case: power loss
          # between the last step and the sentinel. The script then REPLAYS every
          # step, which is the only path that actually exercises them. The
          # header's crash-safety claim lives or dies here.
          #
          # The specific trap: the journal entry is an APPEND (the journal is
          # append-only by contract, so it cannot overwrite like the other steps).
          # Unguarded, a replay stamps a SECOND birth — two genesis events, with
          # identity.toml contradicting journal line 1.
          rm -f "$T/mem/.initialized"
          VIBEOS_MEMORY_DIR="$T/mem" bash memory/genesis.sh
          test -f "$T/mem/.initialized"   # the replay completes
          births="$(grep -ho '"type":"genesis"' "$T"/mem/journal/*.jsonl | wc -l)"
          test "$births" -eq 1 \
            || { echo "FAIL: replayed partial run stamped $births births, expected 1"; exit 1; }
          echo "Genesis re-entrancy OK (replay after a partial run: still one birth)"
          # The crash-replay above ran without VIBEOS_INTERVIEW: the interview
          # wired into genesis.sh must have stayed a no-op on that path too.
          test ! -e "$T/mem/user/updates.jsonl"
          # Amnesic marker written by genesis event data.
          VIBEOS_MEMORY_DIR="$T/mem2" VIBEOS_MEMORY_MODE=amnesic bash memory/genesis.sh
          grep -q '^mode = "amnesic"' "$T/mem2/identity.toml"

          # Personality DETERMINISM: same host (same machine_id) => the same
          # character born again, birth timestamp aside. This is the property
          # that makes "the AI picks its own personality" reproducible rather
          # than random, and keeps the soul stable across an amnesic reboot.
          VIBEOS_MEMORY_DIR="$T/mem3" bash memory/genesis.sh
          if ! diff <(grep -v '^birth = ' "$T/mem/personality.toml") \
                    <(grep -v '^birth = ' "$T/mem3/personality.toml") >/dev/null; then
            echo "FAIL: personality is not deterministic for a fixed machine_id"; exit 1
          fi
          echo "Genesis personality OK (deterministic character, birth aside)"

          # --- Birth interview (genesis-interview.sh) --------------------------
          # Scripted mode, contract (b): VIBEOS_INTERVIEW=1 + injected answers,
          # no TTY needed. The COLLAB answer is deliberately hostile (newline,
          # quotes, backslash): every recorded line must still parse as
          # standalone JSON, or an answer could forge extra lines/keys in
          # user/updates.jsonl (A1 poisoning).
          VIBEOS_MEMORY_DIR="$T/mem" VIBEOS_INTERVIEW=1 \
            VIBEOS_INTERVIEW_NAME="Ada Lovelace" \
            VIBEOS_INTERVIEW_LANG="français" \
            VIBEOS_INTERVIEW_DOMAIN="génie logiciel" \
            VIBEOS_INTERVIEW_COLLAB=$'direct "et" concis\navec \\ des pièges' \
            bash memory/genesis-interview.sh
          python3 - "$T/mem/user/updates.jsonl" <<'PY'
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          entries = [json.loads(line) for line in lines]  # each line: valid JSON
          assert [e["key"] for e in entries] == [
              "profile.name", "profile.lang", "profile.domain",
              "preferences.collaboration"], entries
          for e in entries:
              assert set(e) == {"ts", "key", "value", "source"}, e
              assert e["source"] == "genesis-interview", e
          values = {e["key"]: e["value"] for e in entries}
          assert values["profile.name"] == "Ada Lovelace"
          assert values["profile.lang"] == "français"
          # The hostile answer round-trips intact — escaped, never re-shaped.
          assert values["preferences.collaboration"] == 'direct "et" concis\navec \\ des pièges'
          print("Interview scripted mode OK")
          PY
          # Contract (c): a REPLAY (same crash-recovery path genesis.sh takes)
          # must append NOTHING — the source-tag guard trips, because an
          # append-only file cannot be "overwritten back" to its prior state.
          before_iv="$(sha256sum "$T/mem/user/updates.jsonl")"
          VIBEOS_MEMORY_DIR="$T/mem" VIBEOS_INTERVIEW=1 \
            VIBEOS_INTERVIEW_NAME="Ada Lovelace" \
            bash memory/genesis-interview.sh
          after_iv="$(sha256sum "$T/mem/user/updates.jsonl")"
          test "$before_iv" = "$after_iv" \
            || { echo "FAIL: interview replay appended duplicate lines"; exit 1; }
          echo "Interview scripted + replay OK (no duplicate lines)"
          # Wiring: a first boot that opts in records the answers THROUGH
          # genesis.sh (best-effort call between the awakening and the
          # sentinel) and Genesis still completes. Fresh dir: mem4 was already
          # initialized by the awakening-capture run above.
          VIBEOS_MEMORY_DIR="$T/mem5" VIBEOS_INTERVIEW=1 \
            VIBEOS_INTERVIEW_NAME="Grace" VIBEOS_INTERVIEW_LANG="english" \
            bash memory/genesis.sh
          test -f "$T/mem5/.initialized"
          grep -q '"key":"profile.name"' "$T/mem5/user/updates.jsonl"
          echo "Interview wiring through genesis.sh OK"
          rm -rf "$T"

  policy:
    name: policy.d — TOML schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fast structural check (the deep check is the Rust integration test in
      # the `rust` job, which uses vibed's real parser). Mirrors vibed's
      # fail-closed load rules: unique rule ids, tools/tier/action required,
      # and action=allow on T2/T3 requires approval="human" (tier is a floor).
      - name: Validate security/policy.d/*.toml (tomllib)
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import tomllib

          files = sorted(glob.glob("security/policy.d/*.toml"))
          if not files:
              sys.exit("FAIL: no *.toml files under security/policy.d/")

          failed = False
          for path in files:
              errors = []
              try:
                  with open(path, "rb") as fh:
                      data = tomllib.load(fh)
              except tomllib.TOMLDecodeError as exc:
                  print(f"FAIL {path}: invalid TOML: {exc}")
                  failed = True
                  continue

              rules = data.get("rule", [])
              if not isinstance(rules, list) or not rules:
                  errors.append("no [[rule]] entries")
                  rules = []

              seen_ids = set()
              for idx, rule in enumerate(rules, start=1):
                  where = f"rule #{idx}"
                  rid = rule.get("id")
                  if not isinstance(rid, str) or not rid:
                      errors.append(f"{where}: missing/invalid string 'id'")
                  elif rid in seen_ids:
                      errors.append(f"{where}: duplicate id {rid!r}")
                  else:
                      seen_ids.add(rid)

                  tools = rule.get("tools")
                  if not (isinstance(tools, list) and tools
                          and all(isinstance(t, str) for t in tools)):
                      errors.append(f"{where}: 'tools' must be a non-empty array of strings")

                  tier = rule.get("tier")
                  if tier not in ("T0", "T1", "T2", "T3"):
                      errors.append(f"{where}: 'tier' must be one of T0..T3 (got {tier!r})")

                  action = rule.get("action")
                  if action not in ("allow", "deny"):
                      errors.append(f"{where}: 'action' must be allow|deny (got {action!r})")

                  approval = rule.get("approval", "none")
                  if approval not in ("none", "human"):
                      errors.append(f"{where}: 'approval' must be none|human (got {approval!r})")

                  if action == "allow" and tier in ("T2", "T3") and approval != "human":
                      errors.append(
                          f"{where}: action=allow with tier {tier} requires "
                          "approval=\"human\" (load error in vibed)")

              if errors:
                  failed = True
                  for err in errors:
                      print(f"FAIL {path}: {err}")
              else:
                  print(f"OK   {path}: {len(rules)} rule(s)")

          sys.exit(1 if failed else 0)
          EOF

  containers-policy:
    name: containers — policy de signature (cosign côté client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-os.yml signe chaque release cosign keyless — signer sans que
      # personne ne vérifie est du théâtre. Le garde vérifie la policy CLIENT
      # STAGED (os/rootfs/usr/share/vibeos/containers/policy-strict.json —
      # staged et non active : activée aujourd'hui elle rejetterait AUSSI
      # l'image authentique, c/image ne matchant que les SAN e-mail ; le
      # check 0 du garde épingle cet état volontairement) :
      #   (a) JSON valide + structure : `default` resté permissif (podman
      #       utilisateur intact), exigence sigstoreSigned KEYLESS (fulcio
      #       OIDC GitHub Actions + rekor) sur ghcr.io/micka420-collab/vibeos,
      #       ancres sigstore épinglées à l'octet près ;
      #   (b) preuve de rejet MÉCANIQUE : une image OCI non signée construite
      #       par le script passe sous le `default`, mais est REJETÉE
      #       (« signature » dans l'erreur) par l'exigence du repo vibeos
      #       extraite VERBATIM de la policy shippée. Exigence retirée ou
      #       affaiblie => la copie passe => rouge.
      # skopeo est préinstallé sur ubuntu-latest ; le garde échoue FERMÉ s'il
      # manque. Portée honnête : ceci prouve le rejet par l'outillage c/image,
      # pas l'effet au `bootc upgrade` d'une machine déployée (machine-gated)
      # — limites détaillées dans os/rootfs/etc/containers/registries.d/vibeos.yaml.
      - name: Policy conteneurs — structure + preuve de rejet (skopeo)
        run: |
          # skopeo est préinstallé sur ubuntu-latest — ceinture-bretelles au
          # cas où l'image runner le retirerait : le garde échoue fermé sans.
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          python3 scripts/check-containers-policy.py
