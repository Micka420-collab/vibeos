# build-os.yml — Build, sign and publish the VibeOS bootc image, and produce
# the install ISOs. Multi-arch via NATIVE runners (no slow qemu emulation).
#
# Design:
#   * A `setup` job decides, from the trigger, whether this is a RELEASE and
#     which architectures to build:
#       - push on main / pull_request / dispatch non confirmé
#           -> BUILD CHECK, amd64 only, no push.
#       - push tag v* / dispatch confirmé (`publier`)
#           -> RELEASE, amd64 + arm64.
#   * `build` runs as a matrix, each arch on its OWN native runner
#     (amd64 -> ubuntu-latest, arm64 -> ubuntu-24.04-arm). Each builds the image
#     for its platform natively and, on a release, pushes an arch-tagged image
#     (`<sha>-<arch>`). `bootc container lint` runs as the last build step.
#   * `manifest` (release only) assembles the per-arch images into one
#     multi-arch manifest (tags: latest, <sha>, and the version on a tag),
#     then signs the manifest with cosign keyless.
#   * `supply_chain` (release only) publishes an SPDX SBOM of the image and
#     runs an advisory Trivy CVE scan (2026 supply-chain transparency).
#   * `iso` (release only) builds one installer ISO per arch, each on its native
#     runner, and uploads it as an artifact.
#
# Auth: the built-in GITHUB_TOKEN — no extra secrets. Signing is cosign
# KEYLESS (OIDC via id-token: write). Les permissions d'écriture (packages,
# id-token) sont accordées PAR JOB, jamais au niveau workflow : setup et les
# builds de vérification tournent en lecture seule.
# Publishing/signing only happen on tags v* — or on a manual dispatch where
# the operator has TYPED `publier` in the confirm_release input (garde contre
# une release accidentelle depuis n'importe quelle branche : un dispatch non
# confirmé n'est qu'un build de vérification amd64). Cut a `v*` tag to release.

name: build-os

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "os/**"
      - "vibed/**" # le binaire vibed est compilé en multi-stage dans os/Containerfile
      - "memory/**"
      - "security/**"
      - ".github/workflows/build-os.yml"
  pull_request:
    paths:
      - "os/**"
      - "vibed/**"
      - "memory/**"
      - "security/**"
      - ".github/workflows/build-os.yml"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: >-
          Taper exactement `publier` pour pousser + signer une release complète
          (images multi-arch, tag :latest, cosign, ISO). Vide = simple build de
          vérification amd64 sans push.
        required: false
        default: ""
      check_arm64:
        description: >-
          Ajouter arm64 au build de VÉRIFICATION (sans aucun push). Sans cette
          option, arm64 n'est construit QUE sur une release : une casse arm64 ne
          se découvre donc qu'au moment du tag, en pleine publication — le motif
          exact du `cannot depsolve` de l'ISO.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

# Deux pushes rapprochés ne doivent pas builder deux images ~12 Go en
# parallèle. Aucun run de PUBLICATION n'est annulé en vol :
#   - une release par tag v* a déjà un groupe unique (refs/tags/v*) ;
#   - une release par dispatch confirmé reçoit un groupe unique par run_id, de
#     sorte qu'un push concurrent sur main ne peut jamais l'interrompre en
#     plein push/signature cosign.
# Seuls les builds de vérification (push/PR sur une même ref) s'annulent.
concurrency:
  group: >-
    build-os-${{ github.event_name == 'workflow_dispatch'
      && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

jobs:
  setup:
    name: Decide release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.cfg.outputs.image }}
      repo: ${{ steps.cfg.outputs.repo }}
      publish: ${{ steps.cfg.outputs.publish }}
      version: ${{ steps.cfg.outputs.version }}
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - name: Compute config
        id: cfg
        # L'entrée de dispatch arrive par l'ENVIRONNEMENT, jamais interpolée dans
        # le texte du script. `${{ ... }}` est substitué par Actions AVANT que le
        # shell ne voie la ligne : une valeur contenant `"; ...; #` deviendrait du
        # code exécuté sur le runner (celui-là même qui pousse et signe les images).
        # Un `$VAR` shell, lui, n'est jamais réinterprété comme du code.
        # Le reste de ce fichier appliquait déjà cette discipline (GITHUB_REF,
        # GITHUB_EVENT_NAME, GITHUB_REPOSITORY_OWNER passent tous par l'env) —
        # cette entrée était la seule exception.
        # Portée honnête : seul quelqu'un ayant les droits d'écriture peut
        # déclencher un workflow_dispatch, et il pourrait de toute façon éditer ce
        # workflow. Ce n'est donc PAS une élévation de privilège — c'est retirer
        # un piège documenté et rendre le fichier cohérent avec lui-même.
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          CHECK_ARM64: ${{ inputs.check_arm64 }}
        run: |
          # repo = owner/name (no registry) for buildah/push; image = full ref
          # (with registry) for manifest/iso docker:// references.
          echo "repo=${GITHUB_REPOSITORY_OWNER,,}/vibeos" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/vibeos" >> "$GITHUB_OUTPUT"
          # Release = tag v*, ou dispatch explicitement confirmé (`publier`).
          # Un dispatch non confirmé reste un build de vérification sans push.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] \
             || { [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] \
                  && [[ "${CONFIRM_RELEASE:-}" == "publier" ]]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-latest","platform":"linux/amd64"},{"arch":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]}' >> "$GITHUB_OUTPUT"
          elif [[ "${CHECK_ARM64:-}" == "true" ]]; then
            # Vérification arm64 SANS publication : la matrice est découplée de
            # `publish`. Tout ce qui pousse (login, manifest, cosign, ISO, SBOM)
            # reste gardé par `publish == 'true'`, donc l'image arm64 est
            # construite, lintée, puis jetée — c'est précisément le contrôle
            # voulu.
            #
            # Pourquoi cette option existe : sans elle, arm64 n'est bâti QUE sur
            # un tag. Une casse arm64 ne se découvre donc qu'EN PLEINE release —
            # le motif exact du `cannot depsolve` de l'ISO, dont le job ne
            # tournait jamais sur une PR et qui a tué une release au tag.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-latest","platform":"linux/amd64"},{"arch":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-latest","platform":"linux/amd64"}]}' >> "$GITHUB_OUTPUT"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }} (native)
    needs: setup
    # Garde-fou ROADMAP Phase 1 : « temps de build CI < 45 min par
    # architecture » — au-delà, le job est tué au lieu de dériver en silence.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push des images d'arch sur ghcr.io (releases seulement)
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space
        run: |
          # The amd64 image carries the NVIDIA/CUDA layer, so image (~12 GB) +
          # osbuild work tree + ISO (~6 GB) blow past the runner's default free
          # space. Reclaim aggressively before building.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Log in to ghcr.io
        if: needs.setup.outputs.publish == 'true'
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native single-platform build (no qemu). `bootc container lint` is the
      # final step of os/Containerfile and fails the job on layout violations.
      - name: Build image (buildah, ${{ matrix.platform }})
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          image: ${{ needs.setup.outputs.repo }}
          tags: ${{ github.sha }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          containerfiles: os/Containerfile
          context: .

      - name: Push arch image to ghcr.io
        if: needs.setup.outputs.publish == 'true'
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ needs.setup.outputs.repo }}
          tags: ${{ github.sha }}-${{ matrix.arch }}

  manifest:
    name: Assemble + sign multi-arch manifest
    if: needs.setup.outputs.publish == 'true'
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push du manifest multi-arch (latest, <sha>, version)
      id-token: write # OIDC pour la signature cosign keyless
    steps:
      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build a manifest list from the per-arch images pushed by the build jobs,
      # tag it latest + <sha> (+ version on a tag), and push it.
      - name: Create and push manifest
        id: manifest
        run: |
          IMAGE="${{ needs.setup.outputs.image }}"
          podman manifest create vibeos
          podman manifest add vibeos "docker://${IMAGE}:${GITHUB_SHA}-amd64"
          podman manifest add vibeos "docker://${IMAGE}:${GITHUB_SHA}-arm64"
          # Push the primary tag first and capture the manifest-list digest for
          # cosign; then push the remaining tags (same digest).
          podman manifest push --all --digestfile=digest.txt vibeos "docker://${IMAGE}:${GITHUB_SHA}"
          DIGEST="$(cat digest.txt)"
          podman manifest push --all vibeos "docker://${IMAGE}:latest"
          if [[ -n "${{ needs.setup.outputs.version }}" ]]; then
            podman manifest push --all vibeos "docker://${IMAGE}:${{ needs.setup.outputs.version }}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing bound to this workflow's OIDC identity, logged in Rekor.
      - name: Sign manifest (cosign keyless)
        run: |
          cosign sign --yes "${{ needs.setup.outputs.image }}@${{ steps.manifest.outputs.digest }}"

  # Supply-chain transparency (2026 best practice for an immutable distro):
  # publish an SPDX SBOM of the image and run an advisory CVE scan. The scan is
  # ADVISORY (exit-code 0) — a security-first OS built on Fedora inherits
  # upstream CVEs we track but do not block early releases on; the report gives
  # visibility. Both are release-only artifacts.
  supply_chain:
    name: SBOM + CVE scan (advisory)
    if: needs.setup.outputs.publish == 'true'
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the arch image from ghcr.io
    steps:
      - name: Log in to ghcr.io (docker, for SBOM/scan pulls)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      # SPDX SBOM of the amd64 image (a concrete single-arch ref; the manifest
      # list is not directly scannable). Auto-uploaded as a build artifact.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.setup.outputs.image }}:${{ github.sha }}-amd64
          format: spdx-json
          output-file: vibeos-amd64.spdx.json
          artifact-name: vibeos-sbom-amd64.spdx.json

      # Advisory CVE scan: report CRITICAL/HIGH, never fail the build (exit 0).
      - name: Trivy vulnerability scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.setup.outputs.image }}:${{ github.sha }}-amd64
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  iso:
    name: Build install ISO (${{ matrix.arch }})
    if: needs.setup.outputs.publish == 'true'
    needs: [setup, build, manifest]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # pull de l'image d'arch depuis ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          # The amd64 image carries the NVIDIA/CUDA layer, so image (~12 GB) +
          # osbuild work tree + ISO (~6 GB) blow past the runner's default free
          # space. Reclaim aggressively before building.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Log in to ghcr.io (root podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Pull ${{ matrix.arch }} image into root container storage
        run: |
          sudo podman pull "${{ needs.setup.outputs.image }}:${GITHUB_SHA}-${{ matrix.arch }}"

      # RELEASE ISO ships NO baked credentials: Anaconda prompts for the account
      # at install time. Only manual test builds bake a throwaway "vibe" account.
      - name: Write installer config
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            cat > config.toml <<'EOF'
          [[customizations.user]]
          name = "vibe"
          password = "changeme"
          groups = ["wheel"]
          EOF
          else
            printf '' > config.toml
          fi

      # Native runner: no --target-arch needed, the image is this arch. The root
      # filesystem type is declared in the image (00-vibeos.toml), so no --rootfs.
      # bootc-image-builder est épinglé par digest (supply chain : l'outil qui
      # fabrique l'artefact final livré aux utilisateurs ne flotte pas sur
      # :latest). Mise à jour délibérée : re-résoudre le digest avec
      #   skopeo inspect --format '{{.Digest}}' docker://quay.io/centos-bootc/bootc-image-builder:latest
      - name: Run bootc-image-builder (--type iso)
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./config.toml:/config.toml:ro \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b \
            --type iso \
            --config /config.toml \
            "${{ needs.setup.outputs.image }}:${GITHUB_SHA}-${{ matrix.arch }}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibeos-iso-${{ matrix.arch }}
          path: output/bootiso/*.iso
          if-no-files-found: error
          retention-days: 14
