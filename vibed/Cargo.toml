[package]
name = "vibed"
version = "0.1.0"
edition = "2021"
# Minimum supported Rust: the WSL2 Ubuntu dev toolchain ships 1.75.
# Cargo.lock is COMMITTED (supply-chain pinning, see SECURITY.md) and pins
# indexmap to 2.5.0 / hashbrown to 0.14.5: newer hashbrown releases require
# the edition2024 cargo feature, unavailable before Rust 1.85. Do not
# `cargo update` those two without bumping the toolchain everywhere.
rust-version = "1.75"
description = "VibeOS system AI daemon: MCP (JSON-RPC 2.0) server over a unix socket, policy-gated and fully audited"
license = "Apache-2.0"
readme = "README.md"

[features]
# OFF by default, and never enabled for the image build (os/Containerfile runs a
# bare `cargo build --release --locked`). Compiles IN the VIBED_SOCKET /
# VIBED_POLICY_DIR / VIBED_AUDIT_DIR environment overrides, so a maintainer can
# run vibed rootless against a scratch socket and the in-repo policy — see
# zed/vibeos-claude-acp/scripts/e2e-zed.sh, the only thing that turns this on.
#
# Why a feature and not a plain env::var: main.rs already claimed these were
# "for DEV and the Zed E2E harness only", but nothing enforced "only" — they were
# compiled into the release binary, and VIBED_POLICY_DIR swaps the ENTIRE
# security policy. Reaching vibed's environment needs root, which the threat
# model already treats as game over, so this is defence in depth, not a fix for a
# live hole. It is still worth having: an unenforced "only" is a claim the code
# does not keep, and tools/svc.rs already holds the opposite standard for a far
# less sensitive knob (systemctl's path is a constant, never a PATH lookup, "so a
# compromised environment can never redirect what vibed — running as root —
# executes"). The shipped daemon now has no code path that reads these at all.
dev-overrides = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree transitively (tokio/mio/socket2); made direct only so the
# ADR-019 helper's `probe` can call unshare(CLONE_NEWUSER) as a BEHAVIOURAL test
# that RestrictNamespaces took (EPERM under deny-all). Same pinned 0.2.x, no new
# supply-chain surface.
libc = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
strip = true
